name: dep-vet

# Reusable workflow. Call it from a repository that adds npm dependencies:
#
#   jobs:
#     dep-vet:
#       uses: nassih-yassine/Dep-Vet/.github/workflows/dep-vet.yml@main
#       permissions:
#         contents: read
#         pull-requests: write
#
# It installs the dep-vet release named by `ref` (falling back to a source
# build), vets every package the lockfile change adds against the PR base, and
# keeps one sticky PR comment. The report always lands in the job log and the
# step summary, so a read-only token only loses the comment.

on:
  workflow_call:
    inputs:
      lockfile:
        description: Path to the lockfile
        type: string
        default: package-lock.json
      base:
        description: Git revision to diff against; defaults to the pull request base branch
        type: string
        default: ""
      ref:
        description: Dep-Vet release tag or branch (a tag is what makes `uses:` pinning meaningful)
        type: string
        default: v0.10.0

permissions:
  contents: read
  pull-requests: write

jobs:
  vet:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `dep-vet lock` reads the base revision with `git show`.
          fetch-depth: 0

      - name: Install dep-vet
        env:
          REF: ${{ inputs.ref }}
          DEP_VET_NO_MODIFY_PATH: "1"
        run: |
          installer=$(mktemp)
          if curl --proto '=https' --tlsv1.2 -fsSL -o "$installer" \
            "https://github.com/nassih-yassine/Dep-Vet/releases/download/$REF/dep-vet-installer.sh" \
            && sh "$installer"; then
            dep-vet --version
            exit 0
          fi
          echo "no release for $REF; building from source"
          if printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            cargo install --git https://github.com/nassih-yassine/Dep-Vet.git --tag "$REF" --locked
          else
            cargo install --git https://github.com/nassih-yassine/Dep-Vet.git --branch "$REF" --locked
          fi

      - name: Vet new dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          LOCKFILE: ${{ inputs.lockfile }}
          BASE_INPUT: ${{ inputs.base }}
          PR_BASE: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          base="${BASE_INPUT:-origin/$PR_BASE}"
          set +e
          dep-vet lock "$LOCKFILE" --base "$base" > dep-vet-report.txt 2>&1
          status=$?
          set -e

          {
            echo "<!-- dep-vet -->"
            echo "### dep-vet: new dependency review"
            echo
            echo '```'
            cat dep-vet-report.txt
            echo '```'
            echo
            echo "exit code: \`$status\` (0 clean, 1 warnings, 2 high risk, 3 could not check)"
          } > dep-vet-comment.md

          # GitHub rejects comment bodies over 65,536 characters.
          if [ "$(wc -c < dep-vet-comment.md)" -gt 60000 ]; then
            head -c 60000 dep-vet-comment.md | iconv -f utf-8 -t utf-8 -c > dep-vet-comment-cut.md
            printf '\n\n_Report truncated; full output in the job log._\n' >> dep-vet-comment-cut.md
            mv dep-vet-comment-cut.md dep-vet-comment.md
          fi

          # The full report always lands in the job log and the step summary,
          # whether or not a comment can be written.
          cat dep-vet-report.txt
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### dep-vet: new dependency review"
              echo
              echo '```'
              cat dep-vet-report.txt
              echo '```'
              echo
              echo "exit code: \`$status\` (0 clean, 1 warnings, 2 high risk, 3 could not check)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Dependabot and fork PRs can carry a read-only token. Losing the
          # comment is a warning, not a failed audit; the exit code below still
          # reflects dep-vet's verdict.
          commented=false
          if existing=$(gh api \
            "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq 'map(select(.body | startswith("<!-- dep-vet -->"))) | first | .id // empty'); then
            if [ -n "$existing" ]; then
              if gh api -X PATCH "repos/$REPOSITORY/issues/comments/$existing" \
                -F body=@dep-vet-comment.md > /dev/null; then
                commented=true
              fi
            elif gh api -X POST \
              "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              -F body=@dep-vet-comment.md > /dev/null; then
              commented=true
            fi
          fi
          if [ "$commented" != true ]; then
            echo "::warning::dep-vet could not write the PR comment (read-only token?); the report is in the step summary and job log."
          fi

          # Warnings pass; high risk and incomplete audits fail the job.
          if [ "$status" -ge 2 ]; then
            exit "$status"
          fi
