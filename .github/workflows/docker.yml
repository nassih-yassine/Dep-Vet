name: Docker

on:
  # cargo-dist creates the release with GITHUB_TOKEN, and GitHub does not start
  # workflows from token-created releases. Run after the Release workflow instead.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (vX.Y.Z)
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dep-vet
  COSIGN_VERSION: v3.1.4
  COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ghcr
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate the tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$RELEASE_TAG}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error::not a release tag: '$tag'"
            exit 1
          fi
          stable=false
          if printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            stable=true
          fi
          {
            echo "tag=$tag"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"
      - name: Download and verify both static binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release download "$TAG" --dir assets \
            --pattern 'dep-vet-*-unknown-linux-musl.tar.xz' \
            --pattern 'dep-vet-*-unknown-linux-musl.tar.xz.sha256'
          cd assets
          sha256sum -c ./*.sha256
          for archive in ./*.tar.xz; do
            gh attestation verify "$archive" \
              --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG"
          done
          for pair in "x86_64:amd64" "aarch64:arm64"; do
            target="${pair%%:*}"
            arch="${pair##*:}"
            mkdir -p "../bin/$arch"
            tar -xJf "dep-vet-$target-unknown-linux-musl.tar.xz"
            cp "dep-vet-$target-unknown-linux-musl/dep-vet" "../bin/$arch/dep-vet"
            chmod +x "../bin/$arch/dep-vet"
          done
      - name: Install cosign
        run: |
          curl --fail --location --silent --show-error \
            --output cosign \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  cosign" | sha256sum -c -
          chmod +x cosign
      - name: Build and test amd64 locally before publishing
        run: |
          docker buildx create --use --driver docker-container --name dep-vet
          docker buildx build --platform linux/amd64 --tag "$IMAGE:smoke" --load .
          # Offline checks only: a broken image must not reach a tag, and a test
          # that needs the network turns a registry outage into a red release.
          docker run --rm "$IMAGE:smoke" --version
          docker run --rm "$IMAGE:smoke" --help > /dev/null
      - name: Build, attest and push both architectures
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ steps.tag.outputs.tag }}
          STABLE: ${{ steps.tag.outputs.stable }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          tags=(--tag "$IMAGE:$TAG")
          if [ "$STABLE" = "true" ]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            "${tags[@]}" \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file metadata.json \
            --push .
      - name: Sign the image by digest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          echo "digest=$digest" >> "$GITHUB_STEP_SUMMARY"
          ./cosign sign --yes "$IMAGE@$digest"
          ./cosign verify "$IMAGE@$digest" \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/\.github/workflows/docker\.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Smoke test the published image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Pulls the pushed index and runs the amd64 manifest. The HIGH exit
          # code is covered by the end-to-end suite, which does not need a
          # registry or the network.
          docker run --rm "$IMAGE:$TAG" --version
          docker run --rm "$IMAGE:$TAG" --help > /dev/null
