name: Docker

on:
  # cargo-dist creates the release with GITHUB_TOKEN, and GitHub does not start
  # workflows from token-created releases. Run after the Release workflow instead.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package
        required: true
        default: v0.13.1

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve tag
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::not a release tag: '$TAG'"; exit 1 ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Download and verify the static binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --dir docker-assets \
            --pattern 'dep-vet-x86_64-unknown-linux-musl.tar.xz' \
            --pattern 'dep-vet-x86_64-unknown-linux-musl.tar.xz.sha256'
          cd docker-assets
          sha256sum -c dep-vet-x86_64-unknown-linux-musl.tar.xz.sha256
          tar -xJf dep-vet-x86_64-unknown-linux-musl.tar.xz
          find . -type f -name dep-vet -exec cp {} ../dep-vet \;
          chmod +x ../dep-vet
      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/dep-vet
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
