name: Docker

on:
  # cargo-dist creates the release with GITHUB_TOKEN, and GitHub does not start
  # workflows from token-created releases. Run after the Release workflow instead.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package
        required: true
        default: v0.13.1

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/dep-vet
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve tag
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::not a release tag: '$TAG'"; exit 1 ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Download and verify both static binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --dir assets \
            --pattern 'dep-vet-*-unknown-linux-musl.tar.xz' \
            --pattern 'dep-vet-*-unknown-linux-musl.tar.xz.sha256'
          cd assets
          sha256sum -c ./*.sha256
          for pair in "x86_64:amd64" "aarch64:arm64"; do
            target="${pair%%:*}"
            arch="${pair##*:}"
            mkdir -p "../bin/$arch"
            tar -xJf "dep-vet-$target-unknown-linux-musl.tar.xz"
            cp "dep-vet-$target-unknown-linux-musl/dep-vet" "../bin/$arch/dep-vet"
            chmod +x "../bin/$arch/dep-vet"
          done
          file ../bin/amd64/dep-vet ../bin/arm64/dep-vet
      - name: Build and push both architectures
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx create --use --driver docker-container --name dep-vet
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:latest" \
            --push .
      - name: Smoke test the published image
        run: |
          docker run --rm "$IMAGE:$TAG" --version
          set +e
          docker run --rm "$IMAGE:$TAG" npm crossenv
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "::error::expected exit 2 for a HIGH finding, got $status"
            exit 1
          fi
