name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Bot branches need an explicit trigger: PRs opened with GITHUB_TOKEN do not
  # start other workflows, so refresh-popular.yml dispatches this one.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogfood:
    # dep-vet audits its own dependencies. Catches unmaintained crates and
    # registry signals before users do; a real finding fails the build, and a
    # reviewed exception goes in .depvet.toml with a reason.
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache dep-vet responses
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/dep-vet
          key: dep-vet-${{ hashFiles('Cargo.lock') }}
          restore-keys: dep-vet-

      - name: Audit this repository's dependencies
        run: cargo run --quiet --locked -- audit Cargo.lock

  test:
    # PRs opened by GITHUB_TOKEN need a human approval to run their
    # pull_request workflow, which blocks auto-merge. Skip that duplicate; the
    # refresh workflow dispatches this job explicitly on the bot branch.
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Formatting, linting, and advisories are platform-independent; running
      # them once keeps the matrix focused on behaviour differences.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Audit crate advisories
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --version 0.23.0 --locked --quiet
          cargo audit

      - name: Test
        run: cargo test --locked --all-targets
