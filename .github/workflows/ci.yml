name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Bot branches need an explicit trigger: PRs opened with GITHUB_TOKEN do not
  # start other workflows, so refresh-popular.yml dispatches this one.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets
