name: refresh-popular

# Keeps the ranked typosquat seeds current: data/popular-npm.txt from npm's
# weekly downloads, and data/popular-{crates,nuget,pypi}.txt from each
# registry's ranking. Opens (or updates) a bot branch, then enables auto-merge
# so CI gates the change like any other.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: refresh-popular
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Regenerate the candidate lists
        run: |
          python3 scripts/refresh-popular-npm.py
          python3 scripts/refresh-popular-seeds.py all

      - name: Validate the data
        run: |
          python3 scripts/refresh-popular-npm.py --self-test
          python3 scripts/refresh-popular-seeds.py --self-test
          cargo test --locked typosquat

      - name: Guard the seeds against silent reshaping
        run: |
          python3 - <<'PY'
          import importlib.util
          import pathlib
          import subprocess
          import sys

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          npm = load("refresh_npm", "scripts/refresh-popular-npm.py")
          seeds = load("refresh_seeds", "scripts/refresh-popular-seeds.py")

          checks = [(pathlib.Path("data/popular-npm.txt"), npm.ANCHORS)]
          for ecosystem, config in seeds.ECOSYSTEMS.items():
              checks.append(
                  (pathlib.Path(f"data/popular-{ecosystem}.txt"), config["anchors"])
              )

          for path, anchors in checks:
              numstat = subprocess.run(
                  ["git", "diff", "--numstat", "--", str(path)],
                  capture_output=True,
                  text=True,
                  check=True,
              ).stdout.split()
              if numstat:
                  changed = int(numstat[0]) + int(numstat[1])
                  if changed > 200:
                      sys.exit(f"{path} changed {changed} lines (limit 200)")

              names = {
                  line.strip()
                  for line in path.read_text().splitlines()
                  if line.strip() and not line.startswith("#")
              }
              missing = [anchor for anchor in anchors if anchor not in names]
              if missing:
                  sys.exit(f"{path} dropped anchor(s): {', '.join(missing)}")
          PY

      - name: Stop when nothing changed
        id: diff
        run: |
          if git diff --quiet -- data/popular-*.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/refresh-popular
          git add data/popular-npm.txt data/popular-crates.txt \
            data/popular-nuget.txt data/popular-pypi.txt
          git commit -m "chore: refresh ranked typosquat candidates"
          git push -f origin HEAD:bot/refresh-popular

          existing=$(gh pr list --head bot/refresh-popular --state open \
            --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head bot/refresh-popular \
              --title "chore: refresh ranked typosquat candidates" \
              --body "Automated refresh of the typosquat seeds by
          \`scripts/refresh-popular-npm.py\` and
          \`scripts/refresh-popular-seeds.py\`. Review the diff; CI must pass
          before auto-merge lands it."
          fi
          gh pr merge bot/refresh-popular --auto --squash --delete-branch

          # A bot PR's pull_request run parks in action_required. Approve it so
          # the required check exists; the job itself is SKIPPED for bot PRs
          # (ci.yml), and GitHub counts a skipped check as satisfied. Fall back
          # to dispatching CI if no pull_request run appears.
          head=$(git rev-parse HEAD)
          approved=false
          for _ in 1 2 3 4 5 6 7 8; do
            run_id=$(gh run list --workflow ci.yml --commit "$head" \
              --event pull_request --json databaseId --jq '.[0].databaseId')
            if [ -n "$run_id" ]; then
              gh api -X POST \
                "repos/${{ github.repository }}/actions/runs/$run_id/approve" \
                >/dev/null 2>&1 || true
              approved=true
              break
            fi
            sleep 5
          done
          if [ "$approved" = false ]; then
            gh workflow run ci.yml --ref bot/refresh-popular
          fi
