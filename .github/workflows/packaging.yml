name: Linux packages

on:
  # A token-created release never starts workflows, so act on the Release run.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (vX.Y.Z)
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  NFPM_VERSION: v2.49.0
  NFPM_SHA256: 2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7

jobs:
  packages:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Build from the tag, so the attestation names refs/tags/vX.Y.Z and can
          # be verified against it.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.tag }}
      - name: Validate the tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$RELEASE_TAG}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::only stable tags are packaged: '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Download and verify the static binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release download "$TAG" --dir assets \
            --pattern 'dep-vet-*-unknown-linux-musl.tar.xz' \
            --pattern 'dep-vet-*-unknown-linux-musl.tar.xz.sha256'
          cd assets
          sha256sum -c ./*.sha256
          for archive in ./*.tar.xz; do
            gh attestation verify "$archive" \
              --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG"
          done
      - name: Install nfpm
        run: |
          curl --fail --location --silent --show-error \
            --output nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/$NFPM_VERSION/nfpm_${NFPM_VERSION#v}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  nfpm.tar.gz" | sha256sum -c -
          tar xzf nfpm.tar.gz nfpm
      - name: Build deb, rpm, apk and pacman packages
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p dist-pkg
          for pair in "x86_64:amd64" "aarch64:arm64"; do
            target="${pair%%:*}"
            arch="${pair##*:}"
            stage="stage-$arch"
            rm -rf "$stage"
            mkdir -p "$stage"
            tar -xJf "assets/dep-vet-$target-unknown-linux-musl.tar.xz" -C "$stage" --strip-components=1
            ( cd "$stage" && DEPVET_VERSION="$VERSION" DEPVET_ARCH="$arch" \
                ../nfpm package --config ../packaging/nfpm.yaml --packager deb --target ../dist-pkg )
            ( cd "$stage" && DEPVET_VERSION="$VERSION" DEPVET_ARCH="$arch" \
                ../nfpm package --config ../packaging/nfpm.yaml --packager rpm --target ../dist-pkg )
            ( cd "$stage" && DEPVET_VERSION="$VERSION" DEPVET_ARCH="$arch" \
                ../nfpm package --config ../packaging/nfpm.yaml --packager apk --target ../dist-pkg )
            ( cd "$stage" && DEPVET_VERSION="$VERSION" DEPVET_ARCH="$arch" \
                ../nfpm package --config ../packaging/nfpm.yaml --packager archlinux --target ../dist-pkg )
          done
          ls -l dist-pkg
      - name: Inspect the packages
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -eu
          shopt -s nullglob
          fail() { echo "::error::$1"; exit 1; }

          if ! command -v bsdtar >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libarchive-tools
          fi
          if ! command -v rpm >/dev/null; then
            sudo apt-get install -y -qq rpm
          fi

          ls -l dist-pkg
          debs=(dist-pkg/*.deb); rpms=(dist-pkg/*.rpm)
          apks=(dist-pkg/*.apk); arch=(dist-pkg/*.pkg.tar.zst)
          [ "${#debs[@]}" -eq 2 ] || fail "expected two debs, found ${#debs[@]}"
          [ "${#rpms[@]}" -eq 2 ] || fail "expected two rpms, found ${#rpms[@]}"
          [ "${#apks[@]}" -eq 2 ] || fail "expected two apks, found ${#apks[@]}"
          [ "${#arch[@]}" -eq 2 ] || fail "expected two pacman packages, found ${#arch[@]}"

          for deb in "${debs[@]}"; do
            name="$(dpkg-deb --field "$deb" Package)"
            version="$(dpkg-deb --field "$deb" Version)"
            echo "$deb: $name $version"
            [ "$name" = "dep-vet" ] || fail "$deb is named $name"
            [ "$version" = "${VERSION}-1" ] || fail "$deb has version $version"
            ctrl="$(dpkg-deb --ctrl-tarfile "$deb" | tar -t)"
            if printf '%s\n' "$ctrl" | grep -Eq '(pre|post)(inst|rm)|^(\./)?(config|triggers)$'; then
              fail "$deb carries a maintainer script: $ctrl"
            fi
            dpkg-deb --contents "$deb" | grep -qE '(^|/)usr/bin/dep-vet$' || fail "$deb lacks the binary"
          done

          for rpm in "${rpms[@]}"; do
            echo "$rpm"
            rpm -qlp "$rpm" | grep -qE '^/usr/bin/dep-vet$' || fail "$rpm lacks the binary"
            if rpm -qp --scripts "$rpm" 2>/dev/null | grep -q .; then
              fail "$rpm carries a scriptlet"
            fi
          done

          for apk in "${apks[@]}"; do
            echo "$apk"
            bsdtar -tf "$apk" | grep -qE '(^|/)usr/bin/dep-vet$' || fail "$apk lacks the binary"
          done

          for pkg in "${arch[@]}"; do
            echo "$pkg"
            bsdtar -tf "$pkg" | grep -qE '(^|/)usr/bin/dep-vet$' || fail "$pkg lacks the binary"
            if bsdtar -tf "$pkg" | grep -qE '(^|/)\.INSTALL$'; then
              fail "$pkg carries .INSTALL"
            fi
          done
      - name: Attest the packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-pkg/*.deb
            dist-pkg/*.rpm
            dist-pkg/*.apk
            dist-pkg/*.pkg.tar.zst
      - name: Smoke test the amd64 package
        run: |
          set -eu
          deb=$(ls dist-pkg/*amd64.deb)
          mkdir -p smoke
          dpkg-deb -x "$deb" smoke
          version="$(smoke/usr/bin/dep-vet --version)"
          case "$version" in
            *"dep-vet 0.13"*) echo "$version" ;;
            *) echo "::error::unexpected version '$version'"; exit 1 ;;
          esac
      # --clobber keeps a re-run of this workflow idempotent. The packages are
      # attested above, so a replaced file still carries provenance for its own
      # bytes; the release tarballs they were built from are attested separately.
      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "$TAG" dist-pkg/*.deb dist-pkg/*.rpm dist-pkg/*.apk dist-pkg/*.pkg.tar.zst --clobber
