[package]
name = "dep-vet"
version = "0.10.0"
edition = "2024"
description = "Check a package's risk before it enters your lockfile"
repository = "https://github.com/nassih-yassine/Dep-Vet"
readme = "README.md"
license = "MIT"
keywords = ["npm", "security", "supply-chain", "typosquat", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive"] }
flate2 = "1.1.11"
notify = "9.0.0"
owo-colors = "4.4.0"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
toml = "1.2.2"
ureq = { version = "3.5.2", features = ["json"] }
zip = "9.8.1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
